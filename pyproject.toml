[project]
name = "crypto-quant-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.5,<5", "pandas>=2.2,<4", "pyarrow>=18", "duckdb>=1.1,<2", "PyYAML>=6,<7", "requests>=2.32,<3", "scikit-learn>=1.6,<2", "xgboost>=3,<4", "quantstats>=0.0.81,<1", "matplotlib>=3.9,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["data", "backtest", "evaluation", "features", "models"]
py-modules = ["main"]
